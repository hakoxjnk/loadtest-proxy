<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HakoXjnk | Distributed Load Test Panel</title>
    <link rel="icon" type="image/x-icon" href="https://i.pinimg.com/736x/2b/7d/10/2b7d103bfadc92765cce6c79a5ab6924.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #0a0b10;
            --card-bg: rgba(20, 21, 26, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --accent-blue: #38bdf8;
            --accent-pink: #f43f5e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { overflow-x: hidden; scroll-behavior: smooth; }

        body {
            font-family: 'Quicksand', sans-serif;
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: url('https://i.pinimg.com/736x/42/b8/26/42b826d33fc960698412539c2b1611ad.jpg') center/cover fixed no-repeat;
            position: relative;
        }

        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 11, 16, 0.92); 
            z-index: -1; 
        }

        .container { width: 100%; max-width: 900px; margin: 0 auto; padding: 0 20px; flex: 1; position: relative; z-index: 10; }

        /* NAVBAR */
        .navbar { 
            display: flex; justify-content: center; align-items: center; 
            padding: 40px 0; width: 100%; position: relative; 
        }
        .nav-links { display: flex; gap: 40px; align-items: center; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-weight: 700; font-size: 18px; transition: 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: var(--text-main); }
        .theme-toggle { background: none; border: none; color: var(--text-main); font-size: 22px; cursor: pointer; transition: 0.3s; position: absolute; right: 0; }
        .theme-toggle:hover { transform: rotate(45deg); color: var(--accent-blue); }

        /* ANIMATION */
        .reveal { opacity: 0; transform: translate3d(0, 40px, 0); transition: opacity 0.5s ease-out, transform 0.5s ease-out; will-change: opacity, transform; }
        .reveal.active { opacity: 1; transform: translate3d(0, 0, 0); }

        /* GLASS CARD (Main Panel) */
        .glass-card {
            background: rgba(20, 21, 26, 0.65); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 28px; overflow: hidden; margin-bottom: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            padding: 40px;
        }

        .panel-header { text-align: center; margin-bottom: 30px; }
        .panel-header h1 { font-size: 32px; font-weight: 800; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 12px; }
        .panel-header h1 i { color: var(--accent-pink); font-size: 24px; }
        .panel-header p { color: var(--accent-blue); font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; }

        /* FORM INPUTS */
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 25px; text-align: left; }
        .input-group label { font-size: 13px; color: #8b949e; text-transform: uppercase; font-weight: 700; letter-spacing: 1.5px; display: flex; align-items: center; gap: 8px; }
        .input-group label i { font-size: 14px; color: var(--accent-blue); }
        
        .glass-input {
            background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff; padding: 16px 20px; border-radius: 16px; font-family: 'Quicksand', sans-serif;
            font-size: 16px; font-weight: 600; outline: none; transition: 0.3s; width: 100%;
        }
        .glass-input:focus { border-color: var(--accent-blue); box-shadow: 0 0 20px rgba(56, 189, 248, 0.2); background: rgba(0, 0, 0, 0.5); }
        .glass-input::placeholder { color: #4b5563; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        /* ACTION BUTTON */
        .action-btn {
            background: linear-gradient(90deg, #ec4899, #f43f5e); color: #fff;
            border: none; padding: 18px 30px; border-radius: 16px; font-family: 'Quicksand', sans-serif;
            font-size: 16px; font-weight: 800; cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
            text-transform: uppercase; letter-spacing: 1px; margin-top: 10px;
            box-shadow: 0 10px 20px rgba(244, 63, 94, 0.3);
        }
        .action-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(244, 63, 94, 0.5); background: linear-gradient(90deg, #db2777, #e11d48); }
        .action-btn:active { transform: scale(0.98); }

        /* CONSOLE OUTPUT */
        .console-box {
            background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px; padding: 20px; margin-top: 30px;
            font-family: monospace; font-size: 14px; color: #a3e635;
            min-height: 120px; display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; display: none; /* Ẩn mặc định, hiện khi có kết quả */
        }
        .console-box.show { display: flex; animation: fadeIn 0.5s ease-out; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* EFFECTS */
        .click-heart { position: fixed; color: #ff4757; font-size: 24px; pointer-events: none; z-index: 9999; transform: translate3d(-50%, -50%, 0); animation: floatHeart 1s ease-out forwards; will-change: transform, opacity; }
        @keyframes floatHeart { 0% { transform: translate3d(-50%, -50%, 0) scale(0.5); opacity: 1; } 50% { transform: translate3d(-50%, -80px, 0) scale(1.2); opacity: 1; } 100% { transform: translate3d(-50%, -120px, 0) scale(1.5); opacity: 0; } }

        .snowflake { position: fixed; top: -10px; background: rgba(255, 255, 255, 0.8); border-radius: 50%; pointer-events: none; z-index: 1; animation: fall linear infinite; will-change: transform; }
        @keyframes fall { 0% { transform: translate3d(0, -10px, 0); opacity: 1; } 100% { transform: translate3d(30px, 105vh, 0); opacity: 0.1; } }

        .blog-footer { padding: 40px 0; font-size: 15px; color: var(--text-muted); border-top: 1px solid var(--border-color); text-align: center; }

        @media (max-width: 768px) {
            .navbar { padding: 25px 0; flex-direction: column; gap: 15px; }
            .theme-toggle { top: 25px; right: 0; }
            .nav-links { gap: 15px; flex-wrap: wrap; justify-content: center; }
            .glass-card { padding: 25px 20px; border-radius: 20px; }
            .panel-header h1 { font-size: 26px; }
            .grid-2 { grid-template-columns: 1fr; gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <nav class="navbar reveal active">
            <div class="nav-links">
                <a href="#" class="active">Load Test</a>
            </div>
            <button class="theme-toggle"><i class="fa-solid fa-server"></i></button>
        </nav>

        <div class="glass-card reveal">
            <div class="panel-header">
                <h1><i class="fa-solid fa-network-wired"></i> DISTRIBUTED LOAD TEST</h1>
                <p>Hệ thống đánh giá sức chịu tải máy chủ</p>
            </div>

            <div class="input-group">
                <label><i class="fa-solid fa-globe"></i> Target URL (Mục tiêu)</label>
                <input type="url" id="targetUrl" class="glass-input" placeholder="Ví dụ: https://website-cua-ban.com/?s=test" required>
            </div>

            <div class="grid-2">
                <div class="input-group">
                    <label><i class="fa-solid fa-microchip"></i> Threads (Luồng xử lý)</label>
                    <input type="number" id="threadCount" class="glass-input" value="1000" min="1" max="5000">
                </div>
                <div class="input-group">
                    <label><i class="fa-solid fa-stopwatch"></i> Duration (Thời gian - Giây)</label>
                    <input type="number" id="durationTime" class="glass-input" value="60" min="10">
                </div>
            </div>

            <button class="action-btn" onclick="startLoadTest()" id="btnStart">
                <i class="fa-solid fa-rocket"></i> KÍCH HOẠT KIỂM THỬ TẢI
            </button>

            <div class="console-box" id="consoleOutput">
                </div>
        </div>

        <footer class="blog-footer reveal">
            <p>© 2026 hakodev. Distributed Testing Architecture.</p>
        </footer>
    </div>

    <script>
        // Xử lý Giao tiếp với file Python Backend
        function startLoadTest() {
            const url = document.getElementById('targetUrl').value;
            const threads = document.getElementById('threadCount').value;
            const btn = document.getElementById('btnStart');
            const consoleBox = document.getElementById('consoleOutput');

            if(!url) {
                alert("Vui lòng nhập URL mục tiêu!");
                return;
            }

            // Đổi trạng thái Nút bấm
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> ĐANG XẢ TẢI...';
            btn.style.background = 'linear-gradient(90deg, #3b82f6, #06b6d4)';
            btn.style.boxShadow = '0 10px 20px rgba(59, 130, 246, 0.4)';
            
            // Hiển thị Console
            consoleBox.classList.add('show');
            consoleBox.style.color = "#a3e635";
            consoleBox.innerHTML = `[+] Khởi tạo kết nối tới cụm Proxy...<br>[+] Đang gửi tín hiệu đến Backend Python...`;

            // Gửi API tới Flask Python (đang chạy ở port 5000)
            fetch('http://127.0.0.1:5000/api/start-test', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    url: url,
                    threads: parseInt(threads)
                })
            })
            .then(response => response.json())
            .then(data => {
                // Thành công
                consoleBox.innerHTML = `
                    <i class="fa-solid fa-check-circle" style="font-size: 24px; margin-bottom: 10px;"></i><br>
                    ${data.message}<br>
                    <span style="color: #9ca3af; font-size: 12px; margin-top: 5px;">Kiểm tra màn hình Terminal Python để xem log chi tiết.</span>
                `;
                setTimeout(() => resetBtn(btn), 3000);
            })
            .catch(error => {
                // Thất bại (Python chưa bật)
                consoleBox.style.color = "#f87171";
                consoleBox.innerHTML = `
                    <i class="fa-solid fa-triangle-exclamation" style="font-size: 24px; margin-bottom: 10px;"></i><br>
                    Lỗi kết nối tới Server Python!<br>
                    <span style="color: #9ca3af; font-size: 12px; margin-top: 5px;">Hãy đảm bảo bạn đã gõ lệnh 'python main.py' và server đang chạy ở port 5000.</span>
                `;
                resetBtn(btn);
            });
        }

        function resetBtn(btn) {
            btn.innerHTML = '<i class="fa-solid fa-rocket"></i> KÍCH HOẠT KIỂM THỬ TẢI';
            btn.style.background = '';
            btn.style.boxShadow = '';
        }

        // =========================================
        // HIỆU ỨNG GIAO DIỆN (Giữ nguyên của bạn)
        // =========================================
        document.addEventListener("DOMContentLoaded", function() {
            const reveals = document.querySelectorAll(".reveal");
            const revealOptions = { threshold: 0.1, rootMargin: "0px 0px -20px 0px" };
            const revealObserver = new IntersectionObserver(function(entries, observer) {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add("active");
                        observer.unobserve(entry.target); 
                    }
                });
            }, revealOptions);
            reveals.forEach(reveal => revealObserver.observe(reveal));
            initSnow();
        });

        document.addEventListener('click', function(e) {
            if (e.target.closest('.action-btn') || e.target.closest('input')) return;
            
            let heart = document.createElement('i');
            heart.classList.add('fa-solid', 'fa-heart', 'click-heart');
            heart.style.left = e.clientX + 'px';
            heart.style.top = e.clientY + 'px';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 1000);
        });

        function initSnow() {
            const numFlakes = 25; 
            for (let i = 0; i < numFlakes; i++) {
                const snow = document.createElement('div');
                snow.classList.add('snowflake');
                snow.style.left = Math.random() * 100 + 'vw';
                snow.style.animationDuration = Math.random() * 3 + 3 + 's'; 
                snow.style.animationDelay = Math.random() * 5 + 's'; 
                const size = Math.random() * 4 + 3 + 'px';
                snow.style.width = size;
                snow.style.height = size;
                snow.style.opacity = Math.random() * 0.8 + 0.2;
                document.body.appendChild(snow);
            }
        }
    </script>
</body>
</html>
